version: 2

updates:
  # NuGet dependencies
  - package-ecosystem: "nuget"
    directory: /   # CPM, let's goooo
    schedule:
      interval: "cron"
      cronjob: "0 7 * * TUE,THU"
      timezone: "Europe/Lisbon"
    open-pull-requests-limit: 12
    target-branch: "dev"
    rebase-strategy: "auto"
    groups:
      avalonia:
        patterns:
          - Avalonia
          - Avalonia.*
          - AvaloniaUI.*
          - CommunityToolkit.Mvvm   # not avalonia, but related enough
      testing-packages:
        patterns:
          - xunit.v3*
          - Microsoft.Testing.*
          - BenchmarkDotNet*
    labels:
      - "Scope/Dependencies"
    commit-message:
      prefix: "chore(deps.nuget):"