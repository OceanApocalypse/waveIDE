# Specific manifest
# must not contain perms, metadata or urls

[specific]
entry_point = "a.out" # mandatory

# defines the compatibility contract - if ommitted, uses whatever is shared
[compatibility]
# api version is taken from the variants section
conflicts = [ "dev.joe.i-hate-bob" ] # plugins that lead to conflicts when installed side by side

# editors where the compatibility with the plugin is known to exist - tested
# it's the editor that enforces this policy
# all the SDK does is clean up and interpret 'a:b' syntax
compatibleEditors = [
	"waveIDE", # targetting all versions for an editor
	"waveIDE:*", # same as above
	"waveIDE:3", # specific major version
	"waveIDE:3-1", # major version ranges
	"waveIDE:3.0", # specific minor versions
	"waveIDE:3.0.1", # specific patch versions
	"waveIDE:2-", # every version until a given one (included),
	"waveIDE:3.0.1-/",
	"waveIDE:3.1-2.9.0", # minor and patch ranges
	"waveIDE:2026", # year (any version dating '26 is compatible)
	"waveIDE:latest" # latest version
]

# editors where the compatibility is known to not exist - tested; same syntax applies as above
incompatibleEditors = [ "waveIDE:beta" ]

# defaults to false (if set to true, any editor not in 'compatible' is automatically incompatible)
# if set to false, editors not in 'compatible' are considered compatible, but untested
# it's up to the editor to decide whether something untested should try to run or straight up be disabled
unspecified_are_incompatible = true


[[themes]] # if a theme is here and its name is not in the shared manifest, it's a critical error
name = "Example Theme"
file = "path/to/theme"

[[themes]]
name = "Bob's Amazing Theme"
file = "other/theme" # must have file if there was no shared fallback


[[locales]] # if a locale is here and its name is not in the shared manifest, it's a critical error
iso_name = "pt"			# must match a ISO 639-1/639-3 name
name = "pt-PT"			# must match a .NET culture name
file = "path/to/file"	# must have file if there was no shared fallback

[[locales]]
iso_name = "sk"			# must match a ISO 639-1/639-3 name
name = "sk-SK"			# must match a .NET culture name
file = "path/to/sk"


# no languages here
